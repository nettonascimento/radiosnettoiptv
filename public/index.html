<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV RadiosNetto — Lista de canais</title>
<meta name="description" content="Lista IPTV RadiosNetto: canais de TV e rádios web em um link M3U sempre atualizado.">
<style>
  :root { --bg:#0b0f1a; --panel:#141a2a; --line:#232c44; --text:#e8ecf6; --muted:#8c97b3; --accent:#ffb21e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:48px 20px 28px; text-align:center; background:radial-gradient(ellipse at top,#22305a 0%,transparent 70%); }
  h1 { margin:0 0 8px; font-size:clamp(1.8rem,5vw,2.8rem); letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  header p { margin:0 auto 24px; color:var(--muted); max-width:560px; }
  .link { display:flex; gap:8px; max-width:560px; margin:0 auto; }
  .link input { flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  button, .btn { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#1a1200; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .meta { margin-top:14px; font-size:.9rem; color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:0 20px 60px; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0; position:sticky; top:0; background:var(--bg); padding:12px 0; z-index:2; }
  .tools input { flex:1 1 220px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; width:100%; }
  .chip { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); font-weight:500; font-size:.85rem; }
  .chip.on { background:var(--accent); color:#1a1200; border-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .card { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); cursor:pointer; text-align:left; color:var(--text); font:inherit; }
  .card:hover { border-color:var(--accent); }
  .logo { width:44px; height:44px; flex:none; border-radius:8px; background:#0e1322; display:grid; place-items:center; overflow:hidden; font-weight:700; color:var(--accent); }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .card b { display:block; font-size:.92rem; }
  .card small { color:var(--muted); font-size:.75rem; }
  dialog { width:min(900px,94vw); padding:0; border:1px solid var(--line); border-radius:14px; background:#000; color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.75); }
  dialog video { width:100%; display:block; aspect-ratio:16/9; background:#000; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--panel); }
  .bar button { padding:6px 12px; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>IPTV <span>RadiosNetto</span></h1>
  <p>Canais de TV e rádios web em uma única lista. Cole o link abaixo no seu aplicativo IPTV (VLC, IPTV Smarters, TiviMate, Kodi…).</p>
  <div class="link">
    <input id="url" readonly aria-label="Link da lista M3U">
    <button id="copy">Copiar</button>
    <a class="btn" href="/lista.m3u" download>Baixar</a>
  </div>
  <div class="meta" id="meta">Carregando canais…</div>
</header>
<main>
  <div class="tools">
    <input id="q" type="search" placeholder="Buscar canal…" aria-label="Buscar canal">
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<dialog id="player">
  <div class="bar"><strong id="now"></strong><button id="close">Fechar</button></div>
  <video id="video" controls autoplay playsinline></video>
</dialog>
<footer>Lista atualizada em 27/10/2026 · As transmissões pertencem às respectivas emissoras.</footer>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
  const listUrl = location.origin + '/lista.m3u';
  const $ = (id) => document.getElementById(id);
  $('url').value = listUrl;
  $('copy').onclick = async () => {
    await navigator.clipboard.writeText(listUrl);
    $('copy').textContent = 'Copiado!';
    setTimeout(() => ($('copy').textContent = 'Copiar'), 1500);
  };

  let channels = [], group = 'TODOS', hls;

  function parse(text) {
    const out = [];
    let info = null;
    for (const line of text.split(/\r?\n/)) {
      if (line.startsWith('#EXTINF')) info = line;
      else if (line.startsWith('http') && info) {
        const attr = (k) => (info.match(new RegExp(k + '="([^"]*)"')) || [])[1] || '';
        out.push({ name: info.slice(info.lastIndexOf(',') + 1).trim(), logo: attr('tvg-logo'), group: attr('group-title').toUpperCase() || 'OUTROS', url: line.trim() });
        info = null;
      }
    }
    return out;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = channels.filter((c) => (group === 'TODOS' || c.group === group) && c.name.toLowerCase().includes(q));
    $('grid').innerHTML = '';
    for (const c of list) {
      const el = document.createElement('button');
      el.className = 'card';
      el.innerHTML = `<span class="logo">${c.logo ? `<img loading="lazy" alt="" src="${c.logo}">` : c.name[0]}</span><span><b></b><small></small></span>`;
      el.querySelector('b').textContent = c.name;
      el.querySelector('small').textContent = c.group;
      const img = el.querySelector('img');
      if (img) img.onerror = () => (img.parentNode.textContent = c.name[0]);
      el.onclick = () => play(c);
      $('grid').append(el);
    }
  }

  function play(c) {
    const v = $('video');
    $('now').textContent = c.name;
    if (hls) hls.destroy(), (hls = null);
    if (c.url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(c.url);
      hls.attachMedia(v);
    } else v.src = c.url;
    $('player').showModal();
  }
  $('close').onclick = () => $('player').close();
  $('player').onclose = () => { $('video').pause(); if (hls) hls.destroy(), (hls = null); };
  $('q').oninput = render;

  fetch('/lista.m3u').then((r) => r.text()).then((text) => {
    channels = parse(text);
    const groups = ['TODOS', ...new Set(channels.map((c) => c.group).sort())];
    $('meta').textContent = `${channels.length} canais · ${groups.length - 1} categorias`;
    for (const g of groups) {
      const b = document.createElement('button');
      b.className = 'chip' + (g === group ? ' on' : '');
      b.textContent = g;
      b.onclick = () => { group = g; document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); render(); };
      $('chips').append(b);
    }
    render();
  });
</script>
</body>
</html>
